[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "fronius-solarapi"
dynamic = ["version"]
description = "Async Python library for the Fronius Solar API (v0 and v1), built on aiohttp"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Matthias Alphart", email = "farmio@alphart.net" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9,<4"]

[tool.hatch.version]
source = "vcs"

[project.urls]
Homepage = "https://github.com/farmio/fronius-solarapi"
Repository = "https://github.com/farmio/fronius-solarapi"
Changelog = "https://github.com/farmio/fronius-solarapi/releases"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "syrupy>=4",
]

[tool.hatch.build.targets.sdist]
include = ["fronius_solarapi"]

[tool.hatch.build.targets.wheel]
packages = ["fronius_solarapi"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "A",     # builtins shadowing
  "ASYNC", # async checks
  "B",     # bugbear
  "D",     # pydocstyle
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "RUF",   # ruff specific
  "SIM",   # simplify
  "UP",    # pyupgrade
]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
